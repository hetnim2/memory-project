<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>한장의 추억 | 시작</title>
    <link rel="stylesheet" href="/static/css/choice.css?v=20260918-1">
</head>
<body>
    <main class="choice-page" id="choicePage">
        <div class="choice-stage">
            <!-- as1·as2 원본에서 만든 좌우 배경 정지 화면 -->
            <img
                class="choice-base"
                data-src="/static/assets/choice/choice-base.png?v=20260918-1"
                decoding="sync"
                fetchpriority="high"
                alt="한장의 추억: 추억 검색 또는 추억 기록 선택">

            <!-- 각 영상은 자기 쪽 배경에만 보이며 고정 장식을 덮지 않습니다. -->
            <video
                class="choice-video choice-video-search"
                id="searchPreview"
                data-src="/static/assets/choice/as1.mp4?v=20260918-1"
                muted
                loop
                playsinline
                preload="auto"
                aria-hidden="true"></video>
            <video
                class="choice-video choice-video-write"
                id="writePreview"
                data-src="/static/assets/choice/as2.mp4?v=20260918-1"
                muted
                loop
                playsinline
                preload="auto"
                aria-hidden="true"></video>

            <!-- 제목·엽서·캐릭터·파이프·돌담은 영상 위에서 항상 같은 위치에 고정합니다. -->
            <img
                class="choice-foreground"
                data-src="/static/assets/choice/choice-foreground.png?v=20260918-1"
                decoding="sync"
                fetchpriority="high"
                alt=""
                aria-hidden="true">

            <!-- 보이는 모양을 추가하지 않는 투명 선택 영역 -->
            <button class="choice-hit choice-hit-search" type="button" data-choice="search">
                <span class="sr-only">추억 검색하러 가기</span>
            </button>
            <button class="choice-hit choice-hit-write" type="button" data-choice="write">
                <span class="sr-only">추억 기록하러 가기</span>
            </button>
        </div>
            <!-- 모바일 전용 선택 화면 시작 -->
    <div class="choice-mobile-stage">

        <video
            class="choice-mobile-video choice-mobile-video-search"
            id="mobileSearchPreview"
            data-src="/static/assets/choice/mobile-search.mp4?v=20260918-2"
            muted
            autoplay
            loop
            playsinline
            preload="auto">
        </video>

        <video
            class="choice-mobile-video choice-mobile-video-write"
            id="mobileWritePreview"
            data-src="/static/assets/choice/mobile-write.mp4?v=20260918-2"
            muted
            autoplay
            loop
            playsinline
            preload="auto">
        </video>

        <img
            class="choice-mobile-foreground"
            data-src="/static/assets/choice/choice-foreground-mobile.png?v=20260918-2"
            alt="한장의 추억 모바일 선택 화면">

        <button
            class="choice-mobile-hit choice-mobile-hit-search"
            type="button"
            data-choice="search">
            <span class="sr-only">추억 검색하러 가기</span>
        </button>

        <button
            class="choice-mobile-hit choice-mobile-hit-write"
            type="button"
            data-choice="write">
            <span class="sr-only">추억 기록하러 가기</span>
        </button>

    </div>
    <!-- 모바일 전용 선택 화면 끝 -->
    </main>

    <script type="module" src="/static/js/choice.js?v=20260918-1"></script>
</body>
</html>
