<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>익명으로 추억 남기기 | 한장의 추억</title>
    <link rel="stylesheet" href="/static/css/fonts.css?v=20260913-3">
    <link rel="stylesheet" href="/static/css/write.css?v=20260913-3">
</head>
<body>
    <main class="write-page">
        <div class="write-stage">
            <img
                class="write-ambient"
                src="/static/assets/images/write-poster.jpg"
                alt=""
                aria-hidden="true">
            <video
                class="write-bg-video"
                src="/static/assets/videos/write.mp4"
                poster="/static/assets/images/write-poster.jpg"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"></video>

            <section class="memory-card" aria-labelledby="pageTitle">
                <h1 id="pageTitle" class="sr-only">익명으로 추억 남기기</h1>
                <form id="memoryForm">
                    <label for="targetName" class="sr-only">추억을 남길 대상 이름</label>
                    <input
                        id="targetName"
                        name="target_name"
                        type="text"
                        maxlength="100"
                        autocomplete="off"
                        required>

                    <label for="memoryContent" class="sr-only">추억 내용</label>
                    <textarea
                        id="memoryContent"
                        name="memory_content"
                        maxlength="100"
                        required></textarea>

                    <p class="character-count">
                        <span id="characterCount">0</span> / 100
                    </p>
                    <button id="submitButton" type="submit">추억 남기기</button>
                    <p
                        class="form-message"
                        id="formMessage"
                        role="status"
                        aria-live="polite"></p>
                </form>
            </section>

            <button
                class="find-memory-button"
                id="findMemoryButton"
                type="button"
                aria-label="추억 찾기"></button>
        </div>
    </main>

    <script type="module" src="/static/js/write.js?v=20260913-3"></script>
</body>
</html>
